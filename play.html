<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>arcadio [BETA] | Game</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet" />
    <link rel="icon" href="favicon.png" />
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="navbar-brand">
        <img src="favicon.png" alt="logo" width="24" height="24" />
        <span>arcadio</span>
      </a>
      <ul class="navbar-links">
        <li><a href="index.html"><img src="img/player-play.svg" alt="" class="nav-icon" />Library</a></li>
        <li><a href="https://ferretosan.com"><img src="img/icons.svg" alt="" class="nav-icon" />More Projects</a></li>
        <li><a href="https://docs.google.com/forms/d/e/1FAIpQLScVePC8RahhnT1Hk_s6ITYWqAmxZubXW4-5F3y_sEyd7rlMDQ/viewform"><img src="img/bug.svg" alt="" class="nav-icon" />Bug Report</a></li>
        <li><a href="https://docs.google.com/forms/d/e/1FAIpQLScqWY2Q1Ce2ibpoqIxBPJv6vNnmdEZon7TG0fT_u_LjbDV14Q/viewform"><img src="img/bulb.svg" alt="" class="nav-icon" />Suggest a Game</a></li>
      </ul>
    </nav>

    <div id="game-root" class="game-page"></div>

    <script>
      (async function () {
        const params = new URLSearchParams(location.search);
        const gameId = params.get("game");
        const root = document.getElementById("game-root");
        if (!gameId) {
          root.innerHTML = "<p>No game selected.</p>";
          return;
        }

        let data;
        try {
          const res = await fetch("games.jsonc");
          if (!res.ok) throw new Error("Failed to load games.jsonc");
          data = await res.json();
        } catch (e) {
          root.innerHTML = "<p>Could not load games list.</p>";
          return;
        }

        const game = (data.games || []).find((g) => g.id === gameId);
        if (!game) {
          root.innerHTML = "<p>Game not found.</p>";
          return;
        }

        const tags = Array.isArray(game.tags) ? game.tags.filter(Boolean) : [];
        const related = (data.games || []).filter((g) => !g.hidden && g.id !== game.id && g.tags && g.tags.some((t) => tags.includes(t))).slice(0, 12);

        const tagsHtml = tags.map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("");
        const relatedHtml = related
          .map((g) => {
            const thumb = g.thumbnail ? `<img src="${escapeHtml(g.thumbnail)}" alt="${escapeHtml(g.title)}">` : "";
            return `<a class="suggested-card" href="play.html?game=${encodeURIComponent(g.id)}">
            <div class="game-thumb">${thumb}</div>
            <div class="game-title">${escapeHtml(g.title)}</div>
          </a>`;
          })
          .join("");

        const backHref = "index.html";
        const fullscreenUrl = `play.html?game=${encodeURIComponent(game.id)}&fullscreen=1`;

        root.innerHTML = `
          <div class="game-hero">
            ${game.thumbnail ? `<img class="game-hero-img" src="${escapeHtml(game.thumbnail)}" alt="${escapeHtml(game.title)}">` : ""}
            <div class="game-hero-body">
              <h1>${escapeHtml(game.title)}</h1>
              <div class="game-tags">${tagsHtml}</div>
              <div class="game-actions">
        <a class="btn" href="${escapeHtml(backHref)}">Back</a>
        <button class="btn btn-primary" id="fs-btn">Play in Fullscreen</button>
              </div>
            </div>
          </div>
          <div class="game-frame">
            <iframe src="${escapeHtml(game.url)}" allow="fullscreen; autoplay; gamepad; cross-origin-isolated" allowfullscreen title="${escapeHtml(game.title)}"></iframe>
          </div>
          ${
            related.length
              ? `
          <div class="suggested-section">
            <h2>Suggested games</h2>
            <div class="suggested-grid">${relatedHtml}</div>
          </div>`
              : ""
          }
          <div class="modal-backdrop" id="fs-modal">
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="fs-modal-title">
              <h3 id="fs-modal-title">Reload game?</h3>
              <p>Some games don't scale properly when going into fullscreen. Reloading can fix this.</p>
              <div class="modal-actions">
                <button class="btn" id="fs-no-reload">No, just fullscreen</button>
                <button class="btn btn-primary" id="fs-reload">Reload &amp; fullscreen</button>
              </div>
            </div>
          </div>
        `;

        if (params.get("fullscreen") === "1") {
          try {
            document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
          } catch (e) {}
        }

        const fsBtn = document.getElementById("fs-btn");
        const fsModal = document.getElementById("fs-modal");
        const fsReloadBtn = document.getElementById("fs-reload");
        const fsNoReloadBtn = document.getElementById("fs-no-reload");

        function requestFrameFullscreen() {
          const frame = document.querySelector(".game-frame");
          if (!frame) return;
          if (frame.requestFullscreen) {
            frame.requestFullscreen().catch(() => {});
          } else if (frame.webkitRequestFullscreen) {
            frame.webkitRequestFullscreen();
          }
        }

        if (fsBtn && fsModal) {
          fsBtn.addEventListener("click", () => {
            fsModal.classList.add("show");
          });

          fsModal.addEventListener("click", (e) => {
            if (e.target === fsModal) fsModal.classList.remove("show");
          });

          if (fsNoReloadBtn) {
            fsNoReloadBtn.addEventListener("click", () => {
              fsModal.classList.remove("show");
              requestFrameFullscreen();
            });
          }

          if (fsReloadBtn) {
            fsReloadBtn.addEventListener("click", () => {
              fsModal.classList.remove("show");
              const iframe = document.querySelector(".game-frame iframe");
              if (iframe) iframe.src = iframe.src;
              requestFrameFullscreen();
            });
          }
        }

        function escapeHtml(str) {
          return String(str).replace(/[&<>"']/g, function (m) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
          });
        }
      })();
    </script>
  </body>
</html>
