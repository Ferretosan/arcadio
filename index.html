<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arcadio [BETA] | Free unblocked games for everyone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.png">
</head>
<body>
    <nav class="navbar">
      <a href="index.html" class="navbar-brand">
        <img src="favicon.png" alt="logo" width="24" height="24">
        <span>arcadio</span>
      </a>
      <ul class="navbar-links">
        <li><a href="https://ferretosan.com">Made by Ferretosan!</a></li>
        <li><a href="https://docs.google.com/forms/d/e/1FAIpQLScVePC8RahhnT1Hk_s6ITYWqAmxZubXW4-5F3y_sEyd7rlMDQ/viewform">Bug report</a></li>
        <li><a href="https://docs.google.com/forms/d/e/1FAIpQLScqWY2Q1Ce2ibpoqIxBPJv6vNnmdEZon7TG0fT_u_LjbDV14Q/viewform">Suggest a game</a></li>
      </ul>
    </nav>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          Tags
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle tags">&#9656;</button>
        </div>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search games..." autocomplete="off">
        </div>
        <div id="tag-list"></div>
        <button class="clear-tags" id="clear-tags">Clear filters</button>
      </aside>

      <main class="content">
          <div id="active-filters"></div>
          <section id="categories" aria-live="polite"></section>
          <script src="games.js" defer></script>
          <p class="more-games">+ More games coming soon!</p>
      </main>
    </div>
</body>
</html>
